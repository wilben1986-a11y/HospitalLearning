{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    Iniciar sesión
                </h3>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="form-control"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="form-control"
                            required
                        >
                    </div>

                    {% if next %}
                        <input
                            type="hidden"
                            name="next"
                            value="{{ next }}"
                        >
                    {% endif %}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Ingresar
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
